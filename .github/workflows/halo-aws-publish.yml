name: Publish Combat Lab on mitchellhynes.com

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mitchellhynes-com-production
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-combat-lab-publish
          aws-region: us-east-1

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Publish Combat Lab and retire the old game URLs
        env:
          MH_BUCKET_ID: ${{ secrets.MH_BUCKET_ID }}
          MH_DISTRIBUTION_ID: ${{ secrets.MH_DISTRIBUTION_ID }}
        run: bash .github/scripts/publish-combat-lab.sh
