name: Deploy mitchellhynes.com to AWS

on:
  push:
    branches: [main]
    paths:
      - "apps/mitchellhynes.com/**"
      - "packages/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/mitchellhynes-com-deploy.yml"
      - ".github/scripts/publish-combat-lab.sh"
      - ".github/scripts/combat-lab-redirect.html"
      - ".github/scripts/retired-game-serviceworker.js"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mitchellhynes-com-production
  cancel-in-progress: false

env:
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build site
        run: yarn mitchellhynes.com:build

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-mitchellhynes-com
          aws-region: us-east-1

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: >-
          aws s3 sync --delete
          --exclude "halo"
          --exclude "halo/*"
          --exclude "halo-preview"
          --exclude "halo-preview/*"
          --exclude "combat-lab"
          --exclude "combat-lab/*"
          --exclude "combat-lab-preview"
          --exclude "combat-lab-preview/*"
          ./apps/mitchellhynes.com/dist/
          s3://${{ secrets.MH_BUCKET_ID }}

      - name: Preserve the game redirects and publish the website
        env:
          MH_BUCKET_ID: ${{ secrets.MH_BUCKET_ID }}
          MH_DISTRIBUTION_ID: ${{ secrets.MH_DISTRIBUTION_ID }}
        run: bash .github/scripts/publish-combat-lab.sh --all-site
