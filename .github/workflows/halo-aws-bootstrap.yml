name: Prepare Halo AWS upload

on:
  workflow_dispatch:
    inputs:
      target:
        description: Upload destination
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Configure personal-site AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Inspect personal-site origin
        shell: bash
        env:
          MH_BUCKET_ID: ${{ secrets.MH_BUCKET_ID }}
          MH_DISTRIBUTION_ID: ${{ secrets.MH_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          aws s3api get-bucket-location --bucket "${MH_BUCKET_ID}" --output json || \
            echo "Deployment user cannot inspect bucket metadata; continuing with scoped upload access."
          if aws cloudfront get-distribution-config \
            --id "${MH_DISTRIBUTION_ID}" \
            --output json > /tmp/halo-distribution.json; then
            jq '{
              aliases: .DistributionConfig.Aliases.Items,
              origins: [.DistributionConfig.Origins.Items[] | {
                id: .Id,
                domain: .DomainName,
                path: .OriginPath
              }],
              defaultRootObject: .DistributionConfig.DefaultRootObject,
              customErrors: .DistributionConfig.CustomErrorResponses.Items
            }' /tmp/halo-distribution.json
          else
            echo "Deployment user cannot inspect CloudFront configuration; continuing with scoped upload access."
          fi

      - name: Create temporary upload policy
        shell: bash
        env:
          MH_BUCKET_ID: ${{ secrets.MH_BUCKET_ID }}
          HALO_PREFIX: ${{ inputs.target == 'production' && 'halo' || 'halo-preview' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import boto3
          from botocore.config import Config

          client = boto3.client(
              "s3",
              region_name="ca-central-1",
              config=Config(signature_version="s3v4"),
          )
          upload = client.generate_presigned_post(
              Bucket=os.environ["MH_BUCKET_ID"],
              Key=f"{os.environ['HALO_PREFIX']}/" + "$" + "{filename}",
              Fields={"Cache-Control": "public, max-age=0, must-revalidate"},
              Conditions=[
                  ["content-length-range", 1, 220 * 1024 * 1024],
                  ["starts-with", "$Content-Type", ""],
                  {"Cache-Control": "public, max-age=0, must-revalidate"},
              ],
              ExpiresIn=3600,
          )
          with open("/tmp/halo-upload.json", "w", encoding="utf-8") as output:
              json.dump(upload, output)
          PY

      - name: Publish temporary upload policy
        uses: actions/upload-artifact@v4
        with:
          name: halo-${{ inputs.target }}-upload
          path: /tmp/halo-upload.json
          retention-days: 1
          if-no-files-found: error
