name: Prepare Halo AWS preview upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Configure personal-site AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Inspect personal-site origin
        shell: bash
        env:
          MH_BUCKET_ID: ${{ secrets.MH_BUCKET_ID }}
          MH_DISTRIBUTION_ID: ${{ secrets.MH_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
          aws s3api get-bucket-location --bucket "${MH_BUCKET_ID}" --output json
          aws cloudfront get-distribution-config \
            --id "${MH_DISTRIBUTION_ID}" \
            --output json > /tmp/halo-distribution.json
          jq '{
            aliases: .DistributionConfig.Aliases.Items,
            origins: [.DistributionConfig.Origins.Items[] | {
              id: .Id,
              domain: .DomainName,
              path: .OriginPath
            }],
            defaultRootObject: .DistributionConfig.DefaultRootObject,
            customErrors: .DistributionConfig.CustomErrorResponses.Items
          }' /tmp/halo-distribution.json

      - name: Create temporary preview upload policy
        shell: bash
        env:
          MH_BUCKET_ID: ${{ secrets.MH_BUCKET_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import boto3

          client = boto3.client("s3", region_name="us-east-1")
          upload = client.generate_presigned_post(
              Bucket=os.environ["MH_BUCKET_ID"],
              Key="halo-preview/${filename}",
              Fields={"Cache-Control": "public, max-age=0, must-revalidate"},
              Conditions=[
                  ["content-length-range", 1, 35 * 1024 * 1024],
                  ["starts-with", "$Content-Type", ""],
                  {"Cache-Control": "public, max-age=0, must-revalidate"},
              ],
              ExpiresIn=3600,
          )
          with open("/tmp/halo-preview-upload.json", "w", encoding="utf-8") as output:
              json.dump(upload, output)
          PY

      - name: Publish temporary upload policy
        uses: actions/upload-artifact@v4
        with:
          name: halo-preview-upload
          path: /tmp/halo-preview-upload.json
          retention-days: 1
          if-no-files-found: error
